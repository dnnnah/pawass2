<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#1b5d82">
    <title>Sin conexión | PawPass</title>
    <style>
      :root { color-scheme: light; font-family: "Nunito Sans", ui-sans-serif, system-ui, sans-serif; color: #17364a; background: #f5f9fb; }
      body { box-sizing: border-box; display: grid; min-height: 100svh; margin: 0; padding: 1.25rem; place-items: center; }
      main { width: min(100%, 34rem); border: 1px solid #bfd3dc; border-radius: 1rem; background: #fff; padding: clamp(1.25rem, 6vw, 2.5rem); }
      h1 { margin: 0 0 .75rem; font-size: clamp(1.7rem, 8vw, 2.25rem); line-height: 1.12; }
      p { margin: 0; font-size: 1rem; line-height: 1.6; }
      .brand { margin: 0 0 2rem; color: #1b5d82; font-size: 1.35rem; font-weight: 750; letter-spacing: -.04em; }
      .brand img { width: 1.4rem; height: 1.4rem; margin-left: .25rem; vertical-align: -.2rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">pawpass<img src="/paw-mark.svg" alt=""></p>
      <h1>Necesitas conexión a internet</h1>
      <p>Conéctate para consultar tus fichas y hacer cambios. PawPass no guarda información privada ni cambios para usar sin conexión.</p>
    </main>
  </body>
</html>
